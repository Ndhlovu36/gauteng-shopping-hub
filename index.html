<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping Hub - Union</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>Pi.init({version:"2.0", sandbox:false});</script>
<style>
body{margin:0;font-family:Arial;background:#fff}
.top{height:10px;background:#4a148c}
.wrap{padding:12px}
.login{width:100%;padding:14px;background:#4a148c;color:#fff;border:none;border-radius:10px;font-size:16px}
.reg{width:100%;padding:14px;background:#ffeb3b;color:#000;border:2px solid #000;border-radius:10px;font-weight:bold;margin:10px 0}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #777;border-radius:6px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:2px solid #4a148c;border-radius:10px;padding:12px;text-align:center}
.card b{display:block;margin:8px 0;font-size:18px}
.pay{width:100%;background:#d8a8e0;border:none;padding:9px;border-radius:10px;font-weight:bold}
.hidden{display:none}
.biz{border:1px solid #4a148c;padding:7px;margin:5px 0;border-radius:7px;background:#f3e5f5;font-size:13px}
</style></head><body>
<div class="top"></div><div class="wrap">
<button class="login" onclick="login()">Login with Pi</button>
<p id="user" style="font-size:13px">Not logged in</p>
<input id="addr" placeholder="Delivery Address">
<button class="reg" onclick="document.getElementById('regBox').classList.toggle('hidden')">🏢 Register Your Business - Get Slot (1 Pi)</button>
<div id="regBox" class="hidden" style="border:2px solid gold;padding:10px;border-radius:10px;background:#fffde7">
<input id="bname" placeholder="Business Name"><select id="bcat"><option>Grocery</option><option>Electronics</option><option>Fashion</option><option>Home</option><option>Cars / Vehicles</option><option>Real Estate</option><option>Agriculture</option><option>Other</option></select><input id="bphone" placeholder="WhatsApp"><textarea id="bdesc" placeholder="What goods? e.g. 2 cars for sale, 1 house in PTA"></textarea><button class="login" onclick="regBiz()">Pay 1 Pi to List</button>
</div>
<div class="grid">
<div class="card"><h3>Grocery Pack</h3><b>2 Pi</b><button class="pay" onclick="buy(2,'Grocery Pack')">Pay 2 Pi</button></div>
<div class="card"><h3>Electronics</h3><b>5 Pi</b><button class="pay" onclick="buy(5,'Electronics')">Pay 5 Pi</button></div>
<div class="card"><h3>Fashion Bundle</h3><b>4 Pi</b><button class="pay" onclick="buy(4,'Fashion Bundle')">Pay 4 Pi</button></div>
<div class="card"><h3>Home Appliances</h3><b>12 Pi</b><button class="pay" onclick="buy(12,'Home Appliances')">Pay 12 Pi</button></div>
<div class="card"><h3>🚗 Cars</h3><b>50 Pi</b><button class="pay" onclick="buy(50,'Car')">Pay 50 Pi</button></div>
<div class="card"><h3>🏡 Real Estate</h3><b>100 Pi</b><button class="pay" onclick="buy(100,'Real Estate')">Pay 100 Pi</button></div>
</div>
<h3>My Orders (Locally Saved)</h3><div id="orders">No orders yet</div>
<h3>🏢 Registered Businesses</h3><div id="biz">No businesses yet</div>
</div>
<script>
let cur=null;const S={save:(k,d)=>{try{localStorage.setItem(k,JSON.stringify(d))}catch(e){}},get:(k)=>{try{let v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}};
function login(){Pi.authenticate(['username','payments'],p=>{if(p)fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:p.identifier,txid:p.transaction.txid})})}).then(a=>{cur=a.user;document.getElementById('user').innerText='Hello '+a.user.username;S.save('u_hub',a.user)}).catch(e=>alert(e))}
function render(){let b=S.get('hub_biz')||[];document.getElementById('biz').innerHTML=b.length?b.slice().reverse().map(x=>`<div class="biz"><b>${x.name}</b> (${x.cat})<br>${x.desc}<br>📞${x.phone} - ${x.status}</div>`).join(''):'No businesses yet';let o=S.get('b_hub')||[];document.getElementById('orders').innerHTML=o.length?o.slice().reverse().map(x=>`<div class="biz">${x.item} - ${x.amount} Pi - ${x.status}</div>`).join(''):'No orders yet'}
function regBiz(){let n=document.getElementById('bname').value,c=document.getElementById('bcat').value,p=document.getElementById('bphone').value,d=document.getElementById('bdesc').value;if(!n||!p||!d)return alert('Fill all');if(!cur)return alert('Login');let a=S.get('hub_biz')||[];a.push({name:n,cat:c,phone:p,desc:d,status:'pending'});S.save('hub_biz',a);render();Pi.createPayment({amount:1,memo:'Biz slot '+n,metadata:{name:n}},{onReadyForServerApproval:id=>{fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})})},onReadyForServerCompletion:(id,tx)=>{fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:tx})}).then(()=>{let a=S.get('hub_biz')||[];a[a.length-1].status='PAID '+tx.slice(0,6);S.save('hub_biz',a);alert('Business Listed!');render()})},onCancel:()=>alert('Cancel'),onError:e=>alert(e.message)})}
function buy(am,it){let to=document.getElementById('addr').value;if(!to)return alert('Enter address');if(!cur)return alert('Login');let a=S.get('b_hub')||[];a.push({item:it,amount:am,to,status:'pending'});S.save('b_hub',a);render();Pi.createPayment({amount:am,memo:it,metadata:{item:it}},{onReadyForServerApproval:id=>{fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id})})},onReadyForServerCompletion:(id,tx)=>{fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentId:id,txid:tx})}).then(()=>{let a=S.get('b_hub')||[];a[a.length-1].status='PAID '+tx.slice(0,6);S.save('b_hub',a);alert('SUCCESS '+tx);render()})},onCancel:()=>alert('Cancel'),onError:e=>alert(e.message)})}
window.addEventListener('load',()=>{let u=S.get('u_hub');if(u){cur=u;document.getElementById('user').innerText='Hello '+u.username}render()})
</script></body></html>
