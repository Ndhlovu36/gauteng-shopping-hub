<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title>
<style>body{font-family:Arial;max-width:900px;margin:20px auto;padding:15px}input,select{padding:10px;margin:5px;border:1px solid #ccc;border-radius:6px}button{background:#7b2ff7;color:white;padding:10px 15px;border:0;border-radius:6px;margin:5px}.card{border:1px solid #eee;padding:12px;border-radius:10px;margin:10px 0;display:flex;gap:10px}</style>
</head><body>
<h2 id="bizTitle"></h2><p id="bizInfo"></p>
<div style="background:#f5f5ff;padding:15px;border-radius:10px"><h3>Add Listing</h3><div id="productForm"></div></div>
<h3>My Listings</h3><div id="myProducts"></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('YOUR_SUPABASE_URL','YOUR_SUPABASE_KEY');
let currentBiz=JSON.parse(localStorage.getItem('currentBiz')||'null');if(!currentBiz){location.href='/business/register.html';}
document.getElementById('bizTitle').innerText=currentBiz.name;document.getElementById('bizInfo').innerText=currentBiz.category+' | '+currentBiz.location;
function getForm(cat){if(cat==='cars')return`<input id="fMake" placeholder="Make Toyota"><input id="fModel" placeholder="Model Hilux"><input id="fYear" placeholder="Year 2022"><input id="fMileage" placeholder="Mileage 45000km"><input id="fPrice" type="number" placeholder="Price Pi"><input id="fImage" placeholder="Image URL"><button onclick="addCar()">Add Car</button>`;if(cat==='grocery')return`<input id="fName" placeholder="Product"><input id="fPrice" type="number" placeholder="Price Pi"><input id="fStock" placeholder="Stock"><input id="fExpiry" placeholder="Expiry"><input id="fImage" placeholder="Image URL"><button onclick="addGrocery()">Add Grocery</button>`;if(cat==='realestate')return`<select id="fListingType"><option value="sale">For Sale</option><option value="rental">For Rent</option><option value="management">Management</option></select><input id="fTitle" placeholder="Title"><input id="fPrice" type="number" placeholder="Sale Price Pi"><input id="fRent" type="number" placeholder="Rent/month Pi"><input id="fDeposit" type="number" placeholder="Deposit Pi"><input id="fBeds" placeholder="Beds"><input id="fBaths" placeholder="Baths"><input id="fSize" placeholder="Size sqm"><input id="fLocation" placeholder="Full Address"><input id="fImages" placeholder="Image URLs comma"><input id="fFee" placeholder="Management fee %"><button onclick="addProperty()">List Property</button>`;return`<input id="fName" placeholder="Name"><input id="fPrice" type="number" placeholder="Price Pi"><input id="fImage" placeholder="Image URL"><button onclick="addGeneric()">Add</button>`;}
document.getElementById('productForm').innerHTML=getForm(currentBiz.category);
window.addCar=async function(){let p={business_id:currentBiz.id,category:'cars',title:document.getElementById('fMake').value+' '+document.getElementById('fModel').value,price_pi:parseFloat(document.getElementById('fPrice').value),data:{make:document.getElementById('fMake').value,model:document.getElementById('fModel').value,year:document.getElementById('fYear').value,mileage:document.getElementById('fMileage').value},images:[document.getElementById('fImage').value],status:'available'};await saveProduct(p);}
window.addGrocery=async function(){let p={business_id:currentBiz.id,category:'grocery',title:document.getElementById('fName').value,price_pi:parseFloat(document.getElementById('fPrice').value),data:{stock:document.getElementById('fStock').value,expiry:document.getElementById('fExpiry').value},images:[document.getElementById('fImage').value],status:'available'};await saveProduct(p);}
window.addProperty=async function(){let p={business_id:currentBiz.id,category:'realestate',listing_type:document.getElementById('fListingType').value,title:document.getElementById('fTitle').value,price_pi:document.getElementById('fPrice').value?parseFloat(document.getElementById('fPrice').value):null,rent_per_month_pi:document.getElementById('fRent').value?parseFloat(document.getElementById('fRent').value):null,deposit_pi:document.getElementById('fDeposit').value?parseFloat(document.getElementById('fDeposit').value):null,data:{beds:document.getElementById('fBeds').value,baths:document.getElementById('fBaths').value,size:document.getElementById('fSize').value,location:document.getElementById('fLocation').value,management_fee:document.getElementById('fFee').value},images:document.getElementById('fImages').value.split(','),status:'available'};await saveProduct(p);}
window.addGeneric=async function(){let p={business_id:currentBiz.id,category:currentBiz.category,title:document.getElementById('fName').value,price_pi:parseFloat(document.getElementById('fPrice').value),images:[document.getElementById('fImage').value],status:'available'};await saveProduct(p);}
async function saveProduct(p){if('YOUR_SUPABASE_URL'.includes('YOUR_')){let list=JSON.parse(localStorage.getItem('gauteng_businesses')||'[]');let idx=list.findIndex(b=>b.id==currentBiz.id);let prod={...p,id:Date.now()};if(!list[idx].products)list[idx].products=[];list[idx].products.push(prod);localStorage.setItem('gauteng_businesses',JSON.stringify(list));currentBiz=list[idx];localStorage.setItem('currentBiz',JSON.stringify(currentBiz));render();}else{await supabase.from('products').insert(p);loadMyProducts();}alert('Listed!');}
async function loadMyProducts(){let {data}=await supabase.from('products').select('*').eq('business_id',currentBiz.id);document.getElementById('myProducts').innerHTML=data.map(p=>`<div class="card"><img src="${p.images?.[0]||''}" width=80 height=80 style="border-radius:8px"><div><b>${p.title}</b><br>${p.price_pi||''} Pi ${p.rent_per_month_pi||''}<br><button onclick="deleteProduct(${p.id})">Delete</button></div></div>`).join('');}
window.deleteProduct=async function(id){await supabase.from('products').delete().eq('id',id);loadMyProducts();}
window.render=function(){document.getElementById('myProducts').innerHTML=(currentBiz.products||[]).map(p=>`<div class="card"><img src="${p.images?.[0]||p.image}" width=80 height=80><div><b>${p.title||p.name}</b><br>${p.price_pi||p.price} Pi<br></div></div>`).join('');}
if(!'YOUR_SUPABASE_URL'.includes('YOUR_'))render();else loadMyProducts();
</script></body></html>
